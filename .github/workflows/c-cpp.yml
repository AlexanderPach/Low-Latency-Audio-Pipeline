name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B out/build/ci -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DBUILD_TESTING=ON -DLLAP_BUILD_BENCHMARKS=ON
    - name: Build
      run: cmake --build out/build/ci --parallel 2
    - name: Test
      run: ctest --test-dir out/build/ci --output-on-failure
